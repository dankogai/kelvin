name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    env:
      # used both to build kelvinc and as the backend for generated C
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5

      - name: Show compiler
        run: $CC --version

      - name: Build
        run: make CFLAGS="-std=c11 -O2 -g -Wall -Wextra -Wno-unused-parameter -pedantic -Werror"

      - name: Test
        run: make test

      - name: Run example
        run: ./kelvinc --run examples/hello.k

  freebsd:
    # FreeBSD in a virtual machine (#194): gmake builds with the strict
    # flags, which BSD make does not hand on, and BSD make hands make test
    # to gmake (#193); the tests run as a user, not root, since some check
    # that a file without permission does not open
    name: freebsd / clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          copyback: false
          prepare: |
            pkg install -y gmake python3 node zip
          run: |
            freebsd-version
            cc --version
            pw useradd kelvin -m
            chown -R kelvin .
            su kelvin -c "gmake CFLAGS='-std=c11 -O2 -g -Wall -Wextra -Wno-unused-parameter -pedantic -Werror'"
            su kelvin -c "make test"
            su kelvin -c "./kelvinc --run examples/hello.k"

  sanitizers:
    # check kelvinc itself for memory errors and undefined behavior
    name: sanitizers
    runs-on: ubuntu-latest
    env:
      CC: clang
      # kelvinc frees nothing by design, since it exits right after compiling
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5

      - name: Build kelvinc with sanitizers
        run: make CFLAGS="-std=c11 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined"

      - name: Test
        run: make test

  selfhost:
    # kc, the Kelvin compiler of selfhost/ written in Kelvin (#204): its
    # stages reach a fixpoint, its build of sample.k prints what kelvinc's
    # does, and kc built with sanitizers writes the same C (#228)
    name: selfhost / ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    env:
      # builds kelvinc, the stages and their programs
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make

      - name: Bootstrap
        run: selfhost/bootstrap.sh

      - name: kc with sanitizers
        run: selfhost/sanitize.sh

  asan-programs:
    # the programs the tests make, with the runtime and the modules, under
    # AddressSanitizer and a counting allocator: no memory error, and nothing
    # live at exit, which the ownership rules promise (#175)
    name: asan-programs
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make

      - name: Test programs under ASan
        run: tests/asan.sh
